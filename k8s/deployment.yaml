apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-labs
  labels:
    app: fastapi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: devops-labs
        image: ghcr.io/sofian-ezahery/devops-labs:sha-0753bf3
        ports:
        - containerPort: 8000
