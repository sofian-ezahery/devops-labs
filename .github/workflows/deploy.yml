name: Tests et Linting

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    Quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                 python-version: '3.13'

            - name: Install dépendances
              run: pip install -r requirements.txt

            - name: Linter tests
              run: ruff check .
            
            - name: Run tests
              run: python -m pytest
            
