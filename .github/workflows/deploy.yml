name: Tests et Linting

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    Quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                 python-version: '3.13'

            - name: Install dépendances
              run: pip install -r requirements.txt

            - name: Linter tests
              run: ruff check .
            
            - name: Run tests
              run: python -m pytest
    build:
        needs: Quality
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set env variables
              run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV
            
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}           
