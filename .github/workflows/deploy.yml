name: Tests et Linting

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    Quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Python
              uses: actions/setup-python@v7
              with:
                 python-version: '3.13'

            - name: Install dépendances
              run: pip install -r requirements.txt

            - name: Linter tests
              run: ruff check .
            
            - name: Run tests
              run: python -m pytest
              
    Trivy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Trivy vulnerability scanner (Repository)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: "fs"
                  ignore-unfixed: true
                  format: "table"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"

    build:
        needs: [Quality, Trivy]
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set env variables
              run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV
            
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}           
